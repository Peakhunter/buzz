name: Build Buzz Test Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character Buzz commit SHA to build
        required: true
        type: string

concurrency:
  group: buzz-test-release-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_source:
    name: Verify exact source
    if: github.repository == 'Peakhunter/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Require main workflow authority
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::test releases must be dispatched from refs/heads/main"
            exit 1
          fi

      - name: Validate requested SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse 'HEAD^{commit}')
          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::requested source SHA does not match checked out commit"
            exit 1
          fi
          echo "source_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified source: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse an existing immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="buzz-test-${SOURCE_SHA}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1 || \
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::test release already exists; refusing an expensive rebuild"
            exit 1
          fi

  build:
    name: Build macOS Apple Silicon test release
    needs: verify_source
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      source_sha: ${{ needs.verify_source.outputs.source_sha }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
      version: ${{ steps.identity.outputs.version }}
      handoff_name: ${{ steps.stage.outputs.handoff_name }}
      archive_name: ${{ steps.stage.outputs.archive_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify_source.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify build checkout identity
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$SOURCE_SHA" ]]

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Verify Apple Silicon runner and toolchain
        run: |
          set -euo pipefail
          MACHINE=$(uname -m)
          if [[ "$MACHINE" != "arm64" ]]; then
            echo "::error::expected Apple Silicon runner, got $MACHINE"
            exit 1
          fi
          if [[ "$(rustc -vV)" != *$'host: aarch64-apple-darwin'* ]]; then
            echo "::error::Rust host is not aarch64-apple-darwin"
            rustc -vV
            exit 1
          fi

      - name: Derive test build identity
        id: identity
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA=${SOURCE_SHA:0:12}
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-test.${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get pnpm store directory
        id: pnpm_cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Get Cargo home directory
        id: cargo_cache
        run: |
          set -euo pipefail
          test -n "${CARGO_HOME:-}"
          echo "path=$CARGO_HOME" >> "$GITHUB_OUTPUT"

      - name: Freeze cache keys before build-time lockfile changes
        id: cache_keys
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          PNPM_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
          CARGO_HASH: ${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          COMPILER_HASH: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          NATIVE_HASH: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bin/.cmake-*.pkg') }}
        run: |
          set -euo pipefail
          echo "pnpm_key=pnpm-${RUNNER_OS}-${RUNNER_ARCHITECTURE}-${PNPM_HASH}" >> "$GITHUB_OUTPUT"
          echo "cargo_key=cargo-downloads-${RUNNER_OS}-${RUNNER_ARCHITECTURE}-${CARGO_HASH}" >> "$GITHUB_OUTPUT"
          echo "compiler_scope=rust-compiler-${RUNNER_OS}-${RUNNER_ARCHITECTURE}-${COMPILER_HASH}" >> "$GITHUB_OUTPUT"
          echo "compiler_key=rust-compiler-${RUNNER_OS}-${RUNNER_ARCHITECTURE}-${COMPILER_HASH}-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "mesh_scope=mesh-llama-${RUNNER_OS}-${RUNNER_ARCHITECTURE}-metal-macos10.15-${NATIVE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_cache.outputs.path }}
          key: ${{ steps.cache_keys.outputs.pnpm_key }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Cargo downloads cache
        id: cargo_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.cargo_cache.outputs.path }}/registry/index
            ${{ steps.cargo_cache.outputs.path }}/registry/cache
            ${{ steps.cargo_cache.outputs.path }}/registry/src
            ${{ steps.cargo_cache.outputs.path }}/git/db
            ${{ steps.cargo_cache.outputs.path }}/git/checkouts
          key: ${{ steps.cache_keys.outputs.cargo_key }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compiler outputs cache
        id: compiler_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/release/incremental
            desktop/src-tauri/target/release/.fingerprint
            desktop/src-tauri/target/release/build
            desktop/src-tauri/target/release/deps
            desktop/src-tauri/target/release/incremental
          key: ${{ steps.cache_keys.outputs.compiler_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.compiler_scope }}-

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch test version
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri
          cargo update --workspace

      - name: Generate non-updating test bundle config
        run: |
          cat > desktop/src-tauri/tauri.test-release.conf.json <<'JSON'
          {
            "productName": "Buzz Test Release",
            "identifier": "xyz.block.buzz.app.dev.test-release",
            "bundle": {
              "macOS": {
                "minimumSystemVersion": "10.15"
              },
              "createUpdaterArtifacts": false
            },
            "plugins": {
              "updater": {
                "endpoints": []
              },
              "deep-link": {
                "desktop": {
                  "schemes": ["buzz-test-release"]
                }
              }
            }
          }
          JSON

      - name: Build sidecars
        run: |
          set -euo pipefail
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Resolve mesh-llm revision
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]]
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"

      - name: Restore mesh llama build cache
        id: mesh_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: ${{ steps.cache_keys.outputs.mesh_scope }}-${{ steps.mesh_rev.outputs.rev }}

      - name: Build mesh llama native libraries
        if: steps.mesh_restore.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$MESH_REV_SHORT" -type d -name "$MESH_REV_SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $MESH_REV_SHORT not found"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build unsigned Tauri app
        run: cd desktop && pnpm tauri build --verbose --no-sign --features mesh-llm --config src-tauri/tauri.test-release.conf.json
        env:
          BUZZ_BUILD_CANDIDATE_ID: test-release
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Stage release assets and manifest
        id: stage
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
          SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          APP="desktop/src-tauri/target/release/bundle/macos/Buzz Test Release.app"
          [[ -d "$APP" ]] || { echo "::error::isolated Buzz Test Release.app was not produced"; exit 1; }

          APP_NAME=$(basename "$APP")
          [[ "$APP_NAME" == "Buzz Test Release.app" ]] || { echo "::error::unexpected app name: $APP_NAME"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          [[ "$BUNDLE_ID" == "xyz.block.buzz.app.dev.test-release" ]] || { echo "::error::unexpected bundle identifier: $BUNDLE_ID"; exit 1; }

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          EXECUTABLE="$APP/Contents/MacOS/$EXECUTABLE_NAME"
          [[ -x "$EXECUTABLE" ]] || { echo "::error::packaged executable is missing"; exit 1; }
          ARCHITECTURES=$(lipo -archs "$EXECUTABLE")
          if [[ " $ARCHITECTURES " != *" arm64 "* ]]; then
            echo "::error::packaged executable is not Apple Silicon: $ARCHITECTURES"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("desktop/src-tauri/tauri.test-release.conf.json").read_text(encoding="utf-8"))
          assert config["productName"] == "Buzz Test Release"
          assert config["identifier"] == "xyz.block.buzz.app.dev.test-release"
          assert config["bundle"]["createUpdaterArtifacts"] is False
          assert config["plugins"]["updater"]["endpoints"] == []
          assert config["plugins"]["deep-link"]["desktop"]["schemes"] == ["buzz-test-release"]
          PY

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ARCHIVE_NAME="Buzz_test_${SHORT_SHA}_macos-arm64_adhoc.zip"
          HANDOFF_NAME="buzz-test-${SOURCE_SHA}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/$ARCHIVE_NAME"

          SOURCE_SHA="$SOURCE_SHA" SHORT_SHA="$SHORT_SHA" VERSION="$VERSION" ARCHIVE_NAME="$ARCHIVE_NAME" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "version": os.environ["VERSION"],
              "architecture": "aarch64-apple-darwin",
              "archive": os.environ["ARCHIVE_NAME"],
              "signed": True,
              "signing": "ad_hoc",
              "notarized": False,
              "app_name": "Buzz Test Release.app",
              "bundle_identifier": "xyz.block.buzz.app.dev.test-release",
              "candidate_id": "test-release",
              "keyring_service": "buzz-desktop-candidate.test-release",
              "state_root": "~/.buzz-candidate-test-release",
              "deep_link_scheme": "buzz-test-release",
              "updater_enabled": False,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path(os.environ["RUNNER_TEMP"], "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          (cd "$RUNNER_TEMP" && shasum -a 256 "$ARCHIVE_NAME" manifest.json > SHA256SUMS.txt)
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "handoff_name=$HANDOFF_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload one-day release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.stage.outputs.handoff_name }}
          path: |
            ${{ runner.temp }}/${{ steps.stage.outputs.archive_name }}
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      - name: Save pnpm store cache
        if: success() && steps.pnpm_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm_cache.outputs.path }}
          key: ${{ steps.cache_keys.outputs.pnpm_key }}

      - name: Save Cargo downloads cache
        if: success() && steps.cargo_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.cargo_cache.outputs.path }}/registry/index
            ${{ steps.cargo_cache.outputs.path }}/registry/cache
            ${{ steps.cargo_cache.outputs.path }}/registry/src
            ${{ steps.cargo_cache.outputs.path }}/git/db
            ${{ steps.cargo_cache.outputs.path }}/git/checkouts
          key: ${{ steps.cache_keys.outputs.cargo_key }}

      - name: Save compiler outputs cache
        if: success() && steps.compiler_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/release/incremental
            desktop/src-tauri/target/release/.fingerprint
            desktop/src-tauri/target/release/build
            desktop/src-tauri/target/release/deps
            desktop/src-tauri/target/release/incremental
          key: ${{ steps.cache_keys.outputs.compiler_key }}

      - name: Save mesh llama build cache
        if: success() && steps.mesh_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: ${{ steps.cache_keys.outputs.mesh_scope }}-${{ steps.mesh_rev.outputs.rev }}

      - name: Summarize build and cache behavior
        if: always()
        env:
          SOURCE_SHA: ${{ needs.verify_source.outputs.source_sha }}
          PNPM_HIT: ${{ steps.pnpm_restore.outputs.cache-hit }}
          PNPM_MATCHED: ${{ steps.pnpm_restore.outputs.cache-matched-key }}
          CARGO_HIT: ${{ steps.cargo_restore.outputs.cache-hit }}
          CARGO_MATCHED: ${{ steps.cargo_restore.outputs.cache-matched-key }}
          COMPILER_HIT: ${{ steps.compiler_restore.outputs.cache-hit }}
          COMPILER_MATCHED: ${{ steps.compiler_restore.outputs.cache-matched-key }}
          MESH_HIT: ${{ steps.mesh_restore.outputs.cache-hit }}
          MESH_MATCHED: ${{ steps.mesh_restore.outputs.cache-matched-key }}
        run: |
          {
            echo "## Buzz test-release build"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- pnpm cache: hit=\`${PNPM_HIT:-false}\`, restored=\`${PNPM_MATCHED:-none}\`"
            echo "- Cargo downloads: hit=\`${CARGO_HIT:-false}\`, restored=\`${CARGO_MATCHED:-none}\`"
            echo "- Rust compiler outputs: hit=\`${COMPILER_HIT:-false}\`, restored=\`${COMPILER_MATCHED:-none}\`"
            echo "- Mesh llama cache: hit=\`${MESH_HIT:-false}\`, restored=\`${MESH_MATCHED:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.handoff_name }}
          path: release-assets

      - name: Verify release assets
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd release-assets
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_files = {os.environ["ARCHIVE_NAME"], "manifest.json", "SHA256SUMS.txt"}
          actual_files = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit(f"unexpected handoff files: {sorted(actual_files)}")

          checksum_lines = Path("SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          checksum_names = []
          for line in checksum_lines:
              match = re.fullmatch(r"[0-9a-f]{64}  (.+)", line)
              if match is None:
                  raise SystemExit(f"invalid checksum entry: {line!r}")
              checksum_names.append(match.group(1))
          if set(checksum_names) != {os.environ["ARCHIVE_NAME"], "manifest.json"} or len(checksum_names) != 2:
              raise SystemExit(f"unexpected checksum entries: {checksum_names}")

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          expected_manifest = {
              "schema": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "version": os.environ["VERSION"],
              "architecture": "aarch64-apple-darwin",
              "archive": os.environ["ARCHIVE_NAME"],
              "signed": True,
              "signing": "ad_hoc",
              "notarized": False,
              "app_name": "Buzz Test Release.app",
              "bundle_identifier": "xyz.block.buzz.app.dev.test-release",
              "candidate_id": "test-release",
              "keyring_service": "buzz-desktop-candidate.test-release",
              "state_root": "~/.buzz-candidate-test-release",
              "deep_link_scheme": "buzz-test-release",
              "updater_enabled": False,
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": os.environ["EXPECTED_RUN_ID"],
          }
          if manifest != expected_manifest:
              raise SystemExit("manifest identity does not match trusted build outputs")
          PY
          sha256sum -c SHA256SUMS.txt

      - name: Create draft and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="buzz-test-${SOURCE_SHA}"
          TITLE="Buzz Test ${SHORT_SHA}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::immutable test release already exists for $SOURCE_SHA"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::immutable test tag already exists for $SOURCE_SHA"
            exit 1
          fi

          NOTES=$(printf '%s\n' \
            "Ad-hoc signed, non-notarized Buzz test build." \
            "" \
            "Source: $SOURCE_SHA" \
            "Version: $VERSION" \
            "Architecture: Apple Silicon (aarch64)" \
            "" \
            "This is an isolated test prerelease. It is ad-hoc signed, not notarized, and not approved for production release.")

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --draft \
            --prerelease \
            release-assets/*.zip \
            release-assets/manifest.json \
            release-assets/SHA256SUMS.txt

          RELEASES_FILE="$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES_FILE"
          RELEASE_ID=$(
            RELEASES_FILE="$RELEASES_FILE" TAG="$TAG" python3 - <<'PY'
          import json
          import os

          with open(os.environ["RELEASES_FILE"], encoding="utf-8") as releases_file:
              releases = json.load(releases_file)
          matches = [
              release
              for release in releases
              if release["tag_name"] == os.environ["TAG"]
              and release["draft"]
              and release["prerelease"]
          ]
          if len(matches) != 1:
              raise SystemExit("draft release lookup did not return exactly one matching release")
          print(matches[0]["id"])
          PY
          )

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          RELEASE_JSON="$RELEASE_JSON" SOURCE_SHA="$SOURCE_SHA" SHORT_SHA="$SHORT_SHA" TAG="$TAG" python3 - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          names = {asset["name"] for asset in release["assets"]}
          if not release["draft"] or not release["prerelease"]:
              raise SystemExit("release must remain a draft prerelease until verification completes")
          if release["tag_name"] != os.environ["TAG"]:
              raise SystemExit("draft release tag name does not match intended tag")
          if release["target_commitish"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("release target does not match source SHA")
          expected = {
              f"Buzz_test_{os.environ['SHORT_SHA']}_macos-arm64_adhoc.zip",
              "manifest.json",
              "SHA256SUMS.txt",
          }
          if names != expected:
              raise SystemExit(f"unexpected release assets: {sorted(names)}")
          PY

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SOURCE_SHA" >/dev/null

          mapfile -t TAG_OBJECT < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type, .object.sha'
          )
          OBJECT_TYPE="${TAG_OBJECT[0]}"
          OBJECT_SHA="${TAG_OBJECT[1]}"
          for _ in 1 2 3 4; do
            if [[ "$OBJECT_TYPE" == "commit" ]]; then
              break
            fi
            if [[ "$OBJECT_TYPE" != "tag" ]]; then
              echo "::error::test release tag resolves to unsupported object type $OBJECT_TYPE"
              exit 1
            fi
            mapfile -t TAG_OBJECT < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq '.object.type, .object.sha'
            )
            OBJECT_TYPE="${TAG_OBJECT[0]}"
            OBJECT_SHA="${TAG_OBJECT[1]}"
          done
          if [[ "$OBJECT_TYPE" != "commit" ]]; then
            echo "::error::test release tag could not be peeled to a commit"
            exit 1
          fi
          if [[ "$OBJECT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::test release tag resolves to wrong commit: $OBJECT_SHA"
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null
          URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .html_url)
          {
            echo "## Published Buzz test prerelease"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Release: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
