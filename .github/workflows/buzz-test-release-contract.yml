name: Buzz test-release contract

on:
  pull_request:
    paths:
      - .github/workflows/buzz-test-release.yml
      - .github/workflows/buzz-test-release-contract.yml
      - scripts/test-buzz-test-release-workflow.py

permissions:
  contents: read

jobs:
  contract:
    name: Buzz test-release workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: python3 scripts/test-buzz-test-release-workflow.py
